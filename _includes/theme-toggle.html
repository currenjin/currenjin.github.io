{%- comment -%}
  Shared icon-only theme toggle; js/theme.js synchronizes the destination label.
{%- endcomment -%}
<button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="다크 모드로 전환" title="다크 모드로 전환">
  <span class="theme-toggle-mark" data-theme-toggle-mark aria-hidden="true"><svg data-icon="moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20.5 13a8.5 8.5 0 0 1-9.5-9.5A8.5 8.5 0 1 0 20.5 13Z"/></svg></span>
</button>
