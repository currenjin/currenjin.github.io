<ol class="post-chapters">
{% for chapter in include.book.chapters %}
  <li{% if chapter.planned %} class="post-planned"{% endif %}>{% if chapter.planned %}<span>{{ chapter.title | escape }}</span><small>집필 예정</small>{% else %}<a href="{{ chapter.url | relative_url }}">{{ chapter.title | escape }}</a>{% endif %}</li>
{% endfor %}
</ol>
