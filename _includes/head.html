<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#faf8f3">
  {% include theme-boot.html %}
  {% include seo-meta.html %}
  <link rel="stylesheet" href="{{ '/css/main.css?v=20261027-reading-1' | prepend: site.baseurl }}">
  <link rel="stylesheet" href="{{ '/css/disclosure.css?v=20261006-2' | prepend: site.baseurl }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | prepend: site.baseurl }}">
  <link rel="icon" type="image/x-icon" href="{{ '/resource/icon/favicon.ico?v=20261028' | prepend: site.baseurl }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/resource/icon/favicon-32x32.png?v=20261028' | prepend: site.baseurl }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/resource/icon/favicon.svg?v=20261028' | prepend: site.baseurl }}">
  <link rel="manifest" href="{{ '/resource/icon/manifest.json' | prepend: site.baseurl }}">
{% if page.url == '/' %}  <link rel="stylesheet" href="{{ '/css/home-cosmos.css?v=20261029-bionic-1' | prepend: site.baseurl }}">
  <script type="module" src="{{ '/js/home-cosmos.bundle.js?v=20261029-opt-1' | prepend: site.baseurl }}"></script>
  <link rel="stylesheet" href="{{ '/css/home-notes.css?v=20261029-margin-1' | prepend: site.baseurl }}">
  <script defer src="{{ '/js/home-notes.js?v=20261029-right-1' | prepend: site.baseurl }}"></script>
{% endif %}  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/resource/icon/apple-icon-180x180.png?v=20261028' | prepend: site.baseurl }}">
  <script defer src="{{ '/js/theme.js?v=20261027-warm-a-1' | prepend: site.baseurl }}"></script>
  <script defer src="{{ '/js/focus-trap.js?v=20260926-1' | prepend: site.baseurl }}"></script>
{% if page.layout == 'reviews' %}  <script defer src="{{ '/js/ledger.js?v=20261027-reviews-v2-1' | prepend: site.baseurl }}"></script>
  <link rel="stylesheet" href="{{ '/css/reviews.css?v=20261027-v2-1' | prepend: site.baseurl }}">
  <script defer src="{{ '/js/reviews.js?v=20261029-opt-1' | prepend: site.baseurl }}"></script>
{% else %}  <script defer src="{{ '/js/ledger.js?v=20261020-log-2' | prepend: site.baseurl }}"></script>{% endif %}
  <script defer src="{{ '/js/code-copy.js' | prepend: site.baseurl }}"></script>
  <script defer src="{{ '/js/heading-anchor.js' | prepend: site.baseurl }}"></script>
  <script defer src="{{ '/js/lazy-images.js' | prepend: site.baseurl }}"></script>
  <script defer src="{{ '/js/content-images.js?v=20261027-reading-1' | prepend: site.baseurl }}"></script>
  {% if site.google_analytics.ua %}<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics.ua }}"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','{{ site.google_analytics.ua }}');</script>{% endif %}
