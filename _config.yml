# Site settings
title: currenjin
url: "https://currenjin.github.io"
baseurl: ""
description: >
    세계의 광활함을 사유하고 기록하는 아카이브
og_image: "/resource/james_webb.png"
medium_feed_url: "https://medium.com/feed/@jung23e"

# My information
email: hyun0524e@naver.com
author: currenjin
profile: 정현진
github_username: currenjin
instagram_username: currenjin
comment-support: utterances

# Build settings
plugins:
  - jekyll-gist

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  # https://kramdown.gettalong.org/rdoc/Kramdown/Options.html - smart_quotes
  smart_quotes: ["apos", "apos", "quot", "quot"]

# Collections
collections:
    wiki:
        output: true
        permalink: /:collection/:path/
    reviews:
        output: true
        permalink: /reviews/:path/
    articles:
        output: true
        permalink: /posts/:path/
    chapters:
        output: true
        permalink: /posts/chapters/:path/

# Canonical publication is enforced by _plugins/archive.rb before rendering.
defaults:
  - scope:
      path: ""
      type: articles
    values:
      layout: post
  - scope:
      path: ""
      type: chapters
    values:
      layout: post

# Comment Service
disqus:
  id: currenjin
  shortname: currenjin
utterances:
  repo: currenjin/currenjin.github.io
  issue-term: url
  label: Comment
  branch: main

google_analytics:
  ua: G-3NNF9TB2DY

google_adsense:
  client: #FIXME

blame: "https://github.com/currenjin/currenjin.github.io/blame/main/_wiki"
edit: "https://github.com/currenjin/currenjin.github.io/edit/main/_wiki"
issue: "https://github.com/currenjin/currenjin.github.io/issues/new"

timezone: "Asia/Seoul"

# Local design and preference artifacts must never be published by Jekyll.
exclude:
  - .claude
  - .agents
  - .tasty
  - profiles
  - sketches
  - design-prototypes
  - .ouroboros
  - docs
  - tests
  - test
  - scripts
  - tool
  - AGENTS.md
  - package.json
  - package-lock.json
  - node_modules
  - vendor
