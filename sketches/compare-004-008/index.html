<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>004 × 008 — currenjin archive comparison</title>
<style>
:root{--bg:#e9e7e1;--ink:#181816;--line:#aaa79f;--paper:#fff;--accent:#526469}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Arial,"Apple SD Gothic Neo",sans-serif}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:20px;min-height:58px;padding:10px 18px;border-bottom:1px solid var(--line);background:rgba(233,231,225,.96);backdrop-filter:blur(10px)}
h1{margin:0 auto 0 0;font:600 13px/1.2 Arial,sans-serif;letter-spacing:.02em}.legend{color:#66635d;font-size:11px}.controls{display:flex;gap:4px}.controls button{border:1px solid transparent;background:transparent;padding:7px 10px;color:#625f59;font:11px Arial,sans-serif;cursor:pointer}.controls button[aria-pressed="true"]{border-color:#85817a;background:#f5f3ed;color:#111}.open{color:inherit;font-size:11px;text-underline-offset:3px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:1px;min-height:calc(100vh - 58px);background:var(--line)}
.panel{min-width:0;background:var(--bg)}.panel-head{display:flex;align-items:center;gap:10px;height:35px;padding:0 12px;border-bottom:1px solid var(--line);font-size:11px}.panel-head strong{font-size:12px}.panel-head span{color:#6c6963}.panel-head a{margin-left:auto;color:inherit;text-underline-offset:3px}
.frame-wrap{height:calc(100vh - 93px);background:var(--paper)}iframe{display:block;width:100%;height:100%;border:0;background:var(--paper)}
body[data-viewport="mobile"] .compare{display:flex;justify-content:center;align-items:flex-start;gap:28px;padding:28px;overflow-x:auto;background:#cbc8c1}
body[data-viewport="mobile"] .panel{flex:0 0 390px;width:390px;box-shadow:0 10px 28px rgba(0,0,0,.13)}
body[data-viewport="mobile"] .frame-wrap{height:740px}
@media(max-width:820px){header{position:relative;flex-wrap:wrap;gap:8px 14px}.legend{display:none}.controls{order:3;width:100%}.controls button{flex:1}.compare,body[data-viewport="mobile"] .compare{display:block;padding:0;background:var(--line)}.panel,body[data-viewport="mobile"] .panel{width:100%;max-width:none;margin:0 0 1px;box-shadow:none}.frame-wrap,body[data-viewport="mobile"] .frame-wrap{height:72vh}.panel-head{height:40px}}
</style>
</head>
<body data-viewport="desktop">
<header>
  <h1>currenjin archive · 004 × 008</h1>
  <span class="legend">같은 시점에서 구조와 밀도를 비교</span>
  <div class="controls" aria-label="미리보기 너비">
    <button type="button" data-viewport="desktop" aria-pressed="true">desktop</button>
    <button type="button" data-viewport="mobile" aria-pressed="false">390px mobile</button>
  </div>
</header>
<main class="compare">
  <section class="panel" aria-labelledby="label-004">
    <div class="panel-head"><strong id="label-004">004</strong><span>DLOG editorial home</span><a href="../004-dlog-editorial-home/" target="_blank" rel="noopener">새 창</a></div>
    <div class="frame-wrap"><iframe src="../004-dlog-editorial-home/" title="004 DLOG editorial home"></iframe></div>
  </section>
  <section class="panel" aria-labelledby="label-008">
    <div class="panel-head"><strong id="label-008">008</strong><span>margin archive ledger</span><a href="../008-margin-ledger/" target="_blank" rel="noopener">새 창</a></div>
    <div class="frame-wrap"><iframe src="../008-margin-ledger/" title="008 margin archive ledger"></iframe></div>
  </section>
</main>
<script>
const buttons=[...document.querySelectorAll('.controls button[data-viewport]')];
buttons.forEach(button=>button.addEventListener('click',()=>{
  document.body.dataset.viewport=button.dataset.viewport;
  buttons.forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
}));
</script>
</body>
</html>
