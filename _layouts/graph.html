<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.seo_title | default: page.title }}</title>
<meta name="description" content="{{ page.summary | escape }}">
<link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
<link rel="icon" type="image/svg+xml" href="{{ '/resource/icon/favicon.svg' | prepend: site.baseurl }}">
<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    if (params.get('embed') === '1') {
      document.documentElement.classList.add('graph-embed', 'graph-panel-collapsed');
    } else if (window.matchMedia('(max-width: 720px)').matches) {
      document.documentElement.classList.add('graph-panel-collapsed');
    }
  })();
</script>
<style>
  :root {
    --g-paper: #ecece7;
    --g-ink: #151515;
    --g-muted: #696965;
    --g-faint: #96958e;
    --g-wiki: #52656b;
    --g-line: #cfcec6;
    --g-panel: rgba(236, 236, 231, 0.95);
    --g-serif: Georgia, "Times New Roman", "Apple SD Gothic Neo", serif;
    --g-sans: Arial, "Apple SD Gothic Neo", sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-width: 0; min-height: 100%; background: var(--g-paper); color: var(--g-ink); }
  body { overflow-x: hidden; font-family: var(--g-serif); -webkit-font-smoothing: antialiased; }
  button, a { color: inherit; }
  button { font: inherit; cursor: pointer; }
  a { text-decoration: none; }
  a:hover, a:focus-visible { text-decoration: underline; text-underline-offset: 4px; }
  [hidden] { display: none !important; }

  .graph-skip { position: absolute; left: -9999px; }
  .graph-skip:focus { left: 18px; top: 10px; z-index: 30; padding: 8px; background: var(--g-paper); }
  .graph-site-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 22px 26px;
  }
  .graph-wordmark { font-size: 21px; line-height: 1; letter-spacing: -.035em; }
  .graph-nav { display: flex; align-items: center; gap: 17px; font: 12px/1.2 var(--g-sans); }
  .graph-nav a { display: inline-flex; align-items: center; min-height: 44px; }
  .graph-nav a[aria-current="page"] { text-decoration: underline; text-underline-offset: 4px; }

  .graph-page { padding: 0 26px 38px; }
  .graph-intro { margin: clamp(19px, 3.25vh, 36px) 0 40px; max-width: 650px; }
  .graph-eyebrow { margin: 0 0 16px; color: var(--g-muted); font: 11px/1.5 var(--g-sans); }
  .graph-intro h1 {
    margin: 0; font-weight: 400; font-size: clamp(31px, 4.3vw, 58px); line-height: 1.04;
    letter-spacing: -.045em; text-wrap: balance;
  }

  .knowledge-graph {
    position: relative; width: 100%; height: calc(100dvh - 230px); min-height: 560px;
    overflow: hidden; border-top: 1px solid var(--g-line); border-bottom: 1px solid var(--g-line);
  }
  #graph-canvas, #graph-canvas > div, #graph-canvas canvas { display: block; width: 100%; height: 100%; }
  #graph-canvas:focus-visible { outline: 1px solid var(--g-wiki); outline-offset: -3px; }
  .graph-chip {
    display: grid; place-items: center; border: 1px solid var(--g-line);
    background: rgba(236, 236, 231, .92); color: var(--g-ink); font: 11px/1 var(--g-sans);
  }

  #graph-panel {
    position: absolute; z-index: 6; top: 16px; right: 16px; width: 224px;
    max-height: calc(100% - 32px); overflow: auto; padding: 16px 17px;
    background: var(--g-panel); border: 1px solid var(--g-line); backdrop-filter: blur(9px);
    font: 11px/1.45 var(--g-sans); scrollbar-width: thin; scrollbar-color: var(--g-line) transparent;
  }
  .graph-panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .graph-panel-head p, .graph-tags > p {
    margin: 0; color: var(--g-muted); font: 10px/1.2 var(--g-sans);
    letter-spacing: .04em; text-transform: uppercase;
  }
  .graph-panel-head button, #ni-close {
    padding: 0; border: 0; background: none; color: var(--g-muted); font: 10px/1.2 var(--g-sans);
  }
  .graph-legend { display: flex; gap: 15px; padding-bottom: 13px; }
  .graph-legend span { display: flex; align-items: center; gap: 6px; color: var(--g-muted); }
  .legend-node { width: 8px; height: 8px; border-radius: 50%; }
  .legend-node.wiki { background: var(--g-wiki); }
  .legend-node.review { background: var(--g-ink); }
  .graph-panel-section { padding: 11px 0; border-top: 1px solid var(--g-line); }
  .graph-panel-section > button {
    display: block; width: 100%; min-height: 30px; padding: 4px 0; border: 0;
    background: none; color: var(--g-muted); text-align: left; font: 11px/1.35 var(--g-sans);
  }
  .graph-panel-section > button::before { content: "○"; display: inline-block; width: 18px; color: var(--g-faint); }
  .graph-panel-section > button.on { color: var(--g-ink); }
  .graph-panel-section > button.on::before { content: "●"; color: var(--g-wiki); }
  .graph-panel-section > button:focus-visible, .graph-panel-head button:focus-visible, #ni-close:focus-visible {
    outline: 1px solid var(--g-wiki); outline-offset: 2px;
  }
  #stats { padding: 2px 0 12px; color: var(--g-muted); font: 10px/1.4 var(--g-sans); }
  #tag-list { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; max-height: 150px; overflow: auto; }
  .tag-chip { padding: 3px 5px; border: 1px solid var(--g-line); background: transparent; color: var(--g-muted); font: 9px/1.2 var(--g-sans); }
  .tag-chip.on { border-color: var(--g-wiki); color: var(--g-ink); }
  #panel-toggle {
    display: none; position: absolute; z-index: 7; top: 16px; right: 16px;
    min-width: 48px; height: 30px; padding: 0 8px;
  }
  html.graph-panel-collapsed #graph-panel { display: none; }
  html.graph-panel-collapsed #panel-toggle { display: grid; }

  #tooltip {
    position: absolute; z-index: 9; width: min(240px, calc(100% - 24px)); padding: 10px 12px;
    background: rgba(236, 236, 231, .97); border: 1px solid var(--g-line);
    pointer-events: none; box-shadow: 0 8px 30px rgba(21, 21, 21, .08); font-family: var(--g-sans);
  }
  #tooltip span, #tooltip strong, #tooltip small { display: block; }
  .tooltip-kind { margin-bottom: 4px; color: var(--g-muted); font: 9px/1.2 var(--g-sans); text-transform: uppercase; }
  .tooltip-kind.wiki { color: var(--g-wiki); }
  #tooltip strong { font: 400 15px/1.3 var(--g-serif); }
  #tooltip small { margin-top: 5px; color: var(--g-muted); font: 10px/1.4 var(--g-sans); }

  #node-info {
    position: absolute; z-index: 8; left: 16px; bottom: 16px; width: min(270px, calc(100% - 32px));
    padding: 15px 16px; background: rgba(236, 236, 231, .97); border: 1px solid var(--g-line);
    backdrop-filter: blur(9px);
  }
  #ni-close { position: absolute; top: 10px; right: 11px; }
  #ni-type { margin-bottom: 6px; color: var(--g-wiki); font: 9px/1.2 var(--g-sans); text-transform: uppercase; }
  #ni-title { max-width: 220px; margin: 0 0 8px; font: 400 18px/1.25 var(--g-serif); }
  #ni-tags, #ni-meta { margin: 0 0 5px; color: var(--g-muted); font: 10px/1.45 var(--g-sans); }
  #ni-link { display: inline-block; margin-top: 7px; color: var(--g-ink); font: 10px/1.2 var(--g-sans); }

  #zoom-btns { position: absolute; z-index: 5; right: 16px; bottom: 16px; display: flex; gap: 5px; }
  #zoom-btns button { width: 32px; height: 30px; }
  #graph-hint {
    position: absolute; z-index: 4; bottom: 20px; left: 50%; margin: 0;
    transform: translateX(-50%); color: var(--g-faint); font: 9px/1 var(--g-sans);
    white-space: nowrap; pointer-events: none;
  }
  #graph-status {
    position: absolute; z-index: 3; inset: 0; display: grid; place-items: center;
    margin: 0; color: var(--g-muted); font: 11px/1.5 var(--g-sans); pointer-events: none;
  }

  html.graph-embed .graph-site-head, html.graph-embed .graph-intro, html.graph-embed .graph-skip { display: none; }
  html.graph-embed .graph-page { padding: 0; }
  html.graph-embed .knowledge-graph { height: 100dvh; min-height: 0; border: 0; }
  html.graph-embed #graph-hint { display: none; }

  @media (max-width: 720px) {
    .graph-site-head { padding: 18px 17px; }
    .graph-nav { gap: 13px; font-size: 11px; }
    .graph-page { padding: 0 17px 28px; }
    .graph-intro { margin: 22px 0 30px; }
    .graph-intro h1 { font-size: 38px; }
    .knowledge-graph { height: calc(100dvh - 205px); min-height: 520px; }
    #graph-panel { top: 12px; right: 12px; width: min(224px, calc(100% - 24px)); max-height: calc(100% - 24px); }
    #panel-toggle { top: 12px; right: 12px; }
    #node-info { left: 12px; bottom: 12px; width: min(270px, calc(100% - 24px)); }
    #zoom-btns { right: 12px; bottom: 12px; }
    #graph-hint { display: none; }
    html.graph-embed .knowledge-graph { height: 100dvh; min-height: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
  }
</style>
</head>
<body>
  <a class="graph-skip" href="#graph-canvas">그래프로 이동</a>
  <header class="graph-site-head">
    <a class="graph-wordmark" href="{{ '/' | prepend: site.baseurl }}">currenjin</a>
    <nav class="graph-nav" aria-label="기록 탐색">
      <a href="{{ '/wiki/index/' | prepend: site.baseurl }}">wiki</a>
      <a href="{{ '/reviews/' | prepend: site.baseurl }}">review</a>
      <a href="{{ '/graph/' | prepend: site.baseurl }}" aria-current="page">graph</a>
    </nav>
  </header>

  <main class="graph-page">
    <header class="graph-intro">
      <p class="graph-eyebrow">graph</p>
      <h1>연결하다</h1>
    </header>

    <section class="knowledge-graph" aria-label="공개 기록 지식 그래프">
      <div id="graph-canvas" tabindex="0" data-source="{{ '/graph-data.json' | prepend: site.baseurl }}" aria-label="드래그와 확대가 가능한 Wiki와 Review 연결 그래프"></div>
      <p id="graph-status" role="status">그래프를 불러오는 중입니다.</p>

      <button id="panel-toggle" class="graph-chip" type="button" aria-label="그래프 설정 열기" aria-expanded="true" aria-controls="graph-panel">filter</button>
      <aside id="graph-panel" aria-label="그래프 표시 설정">
        <div class="graph-panel-head">
          <p>knowledge graph</p>
          <button id="panel-collapse" type="button" aria-label="그래프 설정 접기">닫기</button>
        </div>
        <div class="graph-legend" aria-label="노드 종류">
          <span><i class="legend-node wiki" aria-hidden="true"></i>wiki</span>
          <span><i class="legend-node review" aria-hidden="true"></i>review</span>
        </div>
        <div class="graph-panel-section" aria-label="연결 종류">
          <button id="btn-ww" class="on" type="button" data-link-kind="wiki-wiki" aria-pressed="true">wiki ↔ wiki</button>
          <button id="btn-wr" type="button" data-link-kind="wiki-review" aria-pressed="false">wiki ↔ review</button>
          <button id="btn-rr" class="on" type="button" data-link-kind="review-review" aria-pressed="true">review ↔ review</button>
        </div>
        <div class="graph-panel-section" aria-label="그래프 표시">
          <button id="btn-weight" class="on" type="button" aria-pressed="true">공유 태그 2개 이상</button>
          <button id="btn-labels" type="button" aria-pressed="false">노드 이름</button>
          <button id="btn-tags" type="button" aria-pressed="false">태그</button>
        </div>
        <div id="stats" aria-live="polite"></div>
        <div class="graph-panel-section graph-tags">
          <p>tags</p>
          <div id="tag-list" aria-label="태그 필터"></div>
        </div>
      </aside>

      <div id="tooltip" role="status" hidden></div>
      <aside id="node-info" hidden aria-label="선택한 기록">
        <button id="ni-close" type="button" aria-label="선택 정보 닫기">닫기</button>
        <div id="ni-type"></div>
        <h2 id="ni-title"></h2>
        <div id="ni-tags"></div>
        <div id="ni-meta"></div>
        <a id="ni-link" href="#">기록 열기 →</a>
      </aside>

      <div id="zoom-btns" aria-label="그래프 확대와 축소">
        <button class="graph-chip" type="button" data-zoom="in" aria-label="확대">+</button>
        <button class="graph-chip" type="button" data-zoom="out" aria-label="축소">−</button>
        <button class="graph-chip" type="button" data-zoom="fit" aria-label="전체 보기">fit</button>
      </div>
      <p id="graph-hint">scroll to zoom · drag to move · select a node</p>
    </section>
  </main>

  <script src="https://unpkg.com/force-graph@1.43.5/dist/force-graph.min.js"></script>
  <script src="{{ '/js/graph-force.js' | prepend: site.baseurl }}"></script>
  <script src="{{ '/js/graph.js' | prepend: site.baseurl }}"></script>
</body>
</html>
