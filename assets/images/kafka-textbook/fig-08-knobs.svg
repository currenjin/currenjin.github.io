<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 386" width="300" height="386" role="img" aria-labelledby="fig-08-knobs-title fig-08-knobs-desc">
<title id="fig-08-knobs-title">쓰기 경로 위의 설정 지도</title>
<desc id="fig-08-knobs-desc">레코드가 프로듀서에서 리더, 팔로워, 리더 선출, 컨슈머로 가는 경로의 각 단계에 acks, min.insync.replicas, replica.lag.time.max.ms, unclean 선출과 ELR, 하이 워터마크와 isolation.level이 어디서 작동하는지 보여 준다.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#555b6b"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b5482a"/></marker>
  <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2d5a9e"/></marker>
  <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#555b6b" stroke-width="1.2"/></marker>
</defs>
