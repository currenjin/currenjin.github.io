<title id="fig-15-snapshot-streaming-title">Initial snapshot과 WAL streaming의 시간 관계</title>
<desc id="fig-15-snapshot-streaming-desc">주문 104의 일관된 기준 상태는 CREATED다. Connector가 기준 WAL 위치 L0를 확보하고 consistent snapshot을 읽는 동안 DB에서 PAID 변경이 커밋된다. Snapshot 완료 뒤 기준 L0와 연결된 streaming에서 PAID update 이벤트를 전달한다. 기본적인 consistent initial snapshot의 설명이며 모든 snapshot mode가 동일한 보장과 재개 계약을 갖지는 않는다.</desc>
