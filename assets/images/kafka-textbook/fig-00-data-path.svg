<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="data-title data-desc">
<title id="data-title">그림 1-1. Kafka 전체 구조와 데이터 경로</title>
<desc id="data-desc">Producer에서 partition leader로 배치를 보내고 follower가 fetch해 복제한다. Consumer는 leader에 fetch하고 응답을 역직렬화한다. KRaft controller는 metadata를 관리하며 group coordinator는 멤버십과 offset을 관리한다. 실선은 데이터 이동, 점선은 제어 경로다.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><path d="M0 0L8 3L0 6" fill="#555b6b"/></marker></defs>
<rect width="760" height="520" fill="#fbfaf6"/>
<g font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" fill="#26262b" font-size="16">
<text x="24" y="30" font-weight="600">그림 1-1 · 데이터 경로와 관리 역할</text>
<g fill="#fff" stroke="#26262b"><rect x="24" y="65" width="210" height="110" rx="6"/><rect x="278" y="65" width="220" height="110" rx="6"/><rect x="548" y="65" width="188" height="110" rx="6"/><rect x="278" y="238" width="220" height="84" rx="6"/></g>
<text x="40" y="92" font-weight="600">Producer</text><text x="40" y="120">객체 → 직렬화</text><text x="40" y="149">partition별 배치·전송</text>
<text x="294" y="92" font-weight="600">Broker · partition leader</text><text x="294" y="120">검사 → 활성 로그 추가</text><text x="294" y="149">page cache / segment</text>
<text x="562" y="92" font-weight="600">Consumer</text><text x="562" y="120">fetch → 역직렬화</text><text x="562" y="149">업무 처리 (별도 경계)</text>
<text x="294" y="266" font-weight="600">Broker · follower</text><text x="294" y="295">fetch → 자기 로그에 복제</text>
<g stroke="#555b6b" stroke-width="1.5" marker-end="url(#a)"><path d="M234 115H274"/><path d="M498 115H544"/><path d="M388 175V234"/></g>
<text x="235" y="103" font-size="11">produce</text><text x="500" y="103" font-size="11">응답</text><text x="400" y="205" font-size="13">복제 데이터</text>
<text x="24" y="207" font-size="13" fill="#555b6b">Consumer·follower가 fetch 요청한다.</text><text x="24" y="226" font-size="13" fill="#555b6b">실선 화살표는 payload 이동 방향이다.</text>
<g fill="#f0f4fa" stroke="#2d5a9e"><rect x="24" y="376" width="332" height="94" rx="6"/><rect x="400" y="376" width="336" height="94" rx="6"/></g>
<text x="40" y="403" font-weight="600" fill="#2d5a9e">KRaft controller quorum</text><text x="40" y="432">클러스터 metadata · leader 관리</text><text x="40" y="454" font-size="13">주문 payload를 중계하지 않는다.</text>
<text x="416" y="403" font-weight="600" fill="#2d5a9e">Group coordinator (broker 역할)</text><text x="416" y="432">그룹 · commit → __consumer_offsets</text><text x="416" y="454" font-size="13">Controller quorum과 다른 저장·조정 경로</text>
<g stroke="#2d5a9e" fill="none" stroke-dasharray="5 5"><path d="M190 376V345H310V322"/><path d="M260 345V190H278"/><path d="M568 376V175"/></g>
<text x="24" y="501" font-size="13" fill="#555b6b">점선: 제어·위치 관리의 관계를 단순화한 개념도 · 일반적인 leader 읽기 경로</text>
</g></svg>
