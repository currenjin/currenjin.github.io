<title id="fig-03-acks1-title">acks=1: 성공 응답을 받은 레코드가 사라지는 순서</title>
<desc id="fig-03-acks1-desc">프로듀서가 acks=1로 받은 성공 응답 직후 리더가 멈추고, 그 레코드가 없는 팔로워가 새 리더가 되며, 옛 리더는 돌아와 새 리더의 로그에 맞춰지는 과정을 시간순으로 보여 준다.</desc>
