<title id="fig-16-outbox-boundaries-title">Outbox의 세 저장 경계와 포인트 소비</title>
<desc id="fig-16-outbox-boundaries-desc">원본 DB에서는 orders와 outbox를 한 트랜잭션으로 커밋한다. 별도 relay가 Kafka에 발행하며 재전달할 수 있다. 포인트 consumer는 목적지 DB에서 processed_event의 event ID unique 제약과 포인트 적립을 한 트랜잭션으로 묶는다. 업무 성공 뒤 Kafka 오프셋을 커밋하며 그 전 실패하면 다시 처리할 수 있다. 세 저장 경계 전체를 묶는 전역 원자성은 없다.</desc>
