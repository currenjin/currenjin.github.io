<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-labelledby="fig-06-idempotent-title fig-06-idempotent-desc">
<title id="fig-06-idempotent-title">멱등 프로듀서: 같은 시퀀스 번호의 재전송은 한 번만 기록된다</title>
<desc id="fig-06-idempotent-desc">첫 전송이 기록된 뒤 응답이 유실되고, 프로듀서가 같은 프로듀서 ID와 시퀀스 번호로 재전송하자 리더가 중복을 알아보고 다시 쓰지 않은 채 성공을 돌려주는 과정.</desc>
