<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 268" width="300" height="268" role="img" aria-labelledby="fig-04-rebalance-title fig-04-rebalance-desc">
<title id="fig-04-rebalance-title">비정상 종료에서 다시 읽기까지</title>
<desc id="fig-04-rebalance-desc">인스턴스가 비정상 종료된 뒤 세션 타임아웃 45초 동안 파티션이 멈추고, 리밸런스 후 새 담당자가 마지막 커밋 오프셋부터 읽어 중복이 생기는 과정을 시간순으로 보여 준다.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#555b6b"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b5482a"/></marker>
  <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2d5a9e"/></marker>
  <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#555b6b" stroke-width="1.2"/></marker>
</defs>
<rect width="100%" height="100%" fill="#fbfaf6"/>
<line x1="30" y1="30" x2="30" y2="250" stroke="#c9c5bb" stroke-width="1.2"/>
<rect x="26" y="36" width="8" height="112" rx="2" fill="#fbfaf6"/>
<rect x="26" y="36" width="8" height="112" rx="2" fill="rgba(181,72,42,0.08)" stroke="rgba(181,72,42,0.55)" stroke-width="1"/>
<circle cx="30" cy="36" r="4.5" fill="#b5482a"/>
<circle cx="30" cy="148" r="4.5" fill="#26262b"/>
<circle cx="30" cy="182" r="4.5" fill="#26262b"/>
<circle cx="30" cy="214" r="4.5" fill="#26262b"/>
<circle cx="30" cy="246" r="4.5" fill="#b5482a"/>
<text x="46" y="40.5" fill="#b5482a" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="start">0초 · 인스턴스 2 비정상 종료</text>
<text x="46" y="57" fill="#555b6b" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="start">하트비트가 끊김</text>
<text x="46" y="152.5" fill="#26262b" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="start">45초 · 세션 만료, 멤버 제거</text>
<text x="46" y="186.5" fill="#26262b" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="start">리밸런스: 남은 인스턴스가 받음</text>
<text x="46" y="218.5" fill="#26262b" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="start">마지막 커밋 오프셋부터 읽음</text>
<text x="46" y="250.5" fill="#b5482a" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="start">커밋 뒤 처리분 재처리 → 중복</text>
<text x="46" y="92" fill="#555b6b" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="start">P2·P3를 아무도 읽지 않음</text>
<text x="46" y="108" fill="#555b6b" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="start">소비 지연이 계속 쌓임</text>
</svg>
