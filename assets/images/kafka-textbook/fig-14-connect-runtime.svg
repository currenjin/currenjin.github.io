<title id="fig-14-connect-runtime-title">Kafka Connect의 실행 경계</title>
<desc id="fig-14-connect-runtime-desc">외부 PostgreSQL에서 source worker JVM의 task가 읽어 Kafka로 보내고, 별도 sink worker JVM의 task가 Kafka에서 읽어 검색 엔진에 쓴다. 이 배치 예시에서 두 worker는 별도 프로세스이며 브로커는 커넥터 플러그인을 실행하지 않는다.</desc>
