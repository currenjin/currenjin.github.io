<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 510" role="img" aria-labelledby="memory-title memory-desc">
<title id="memory-title">그림 1-2. JVM과 커널·디스크·네트워크의 경계</title>
<desc id="memory-desc">JVM은 요청과 상태를 관리하고 로그 파일의 큰 캐시는 OS page cache에 둔다. Dirty page를 writeback으로 디스크에 반영하고 cache miss는 디스크에서 읽는다. 변환 없는 비 TLS 파일 전송은 조건부 sendfile 경로를 사용하며 TLS는 사용자 공간 처리를 거친다. 모든 복사가 사라진다는 뜻이 아니다.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><path d="M0 0L8 3L0 6" fill="#555b6b"/></marker></defs>
<rect width="760" height="510" fill="#fbfaf6"/>
<g font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" fill="#26262b" font-size="16">
<text x="24" y="30" font-weight="600">그림 1-2 · 메모리와 I/O의 서로 다른 층</text>
<rect x="24" y="60" width="710" height="120" rx="6" fill="#fff" stroke="#26262b"/>
<text x="40" y="88" font-weight="600">사용자 공간 · JVM</text><text x="40" y="118">요청·배치 버퍼·metadata·coordinator 상태 · 객체는 GC 관리 대상</text>
<text x="40" y="150" fill="#b5482a">TLS: 파일 데이터를 사용자 공간에서 처리·암호화 → socket</text>
<rect x="24" y="238" width="430" height="104" rx="6" fill="#f0f4fa" stroke="#2d5a9e"/>
<text x="40" y="267" font-weight="600">커널 · OS page cache</text><text x="40" y="294">파일 페이지 재사용 · dirty page는 디스크 미반영</text><text x="40" y="322" font-size="14">큰 로그 캐시를 JVM 객체 캐시로 중복 유지하지 않음</text>
<rect x="554" y="238" width="180" height="104" rx="6" fill="#fff" stroke="#26262b"/>
<text x="570" y="273" font-weight="600">Socket / NIC</text><text x="570" y="304">네트워크 전송</text>
<rect x="24" y="410" width="430" height="66" rx="6" fill="#fff" stroke="#26262b"/>
<text x="40" y="438" font-weight="600">저장장치 · 로그 segment</text><text x="40" y="460" font-size="14">Writeback·fsync와 replica 확인은 다른 완료 조건</text>
<g fill="none" stroke="#555b6b" stroke-width="1.5" marker-end="url(#a)"><path d="M100 180V234"/><path d="M164 342V406"/><path d="M340 410V346"/><path d="M454 280H550"/></g>
<text x="110" y="212" font-size="13">파일 추가</text><text x="34" y="377" font-size="13">dirty writeback ↓</text><text x="265" y="377" font-size="13">cache miss ↑</text>
<text x="470" y="262" font-size="12">sendfile</text><text x="468" y="310" font-size="12">조건부 경로</text>
<path d="M644 180V234" fill="none" stroke="#b5482a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="482" y="204" font-size="12" fill="#b5482a">TLS는 사용자 공간 경유</text>
<text x="24" y="500" font-size="13" fill="#555b6b">Sendfile 조건: 지원 OS·파일 전송·변환 없음·비 TLS · zero-copy ≠ 모든 물리적 복사 제거</text>
</g></svg>
