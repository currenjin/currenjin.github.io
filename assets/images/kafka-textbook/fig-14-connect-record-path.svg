<title id="fig-14-connect-record-path-title">Source와 Sink의 Connect 레코드 경로</title>
<desc id="fig-14-connect-record-path-desc">두 레인은 서로 다른 논리적 데이터 경로다. Source는 외부 DB, source task의 SourceRecord, SMT, converter, producer, Kafka 순서다. Sink는 Kafka, consumer, converter, SMT, SinkRecord를 받는 sink task, 외부 목적지 순서다. Task와 변환 및 Kafka 클라이언트는 worker JVM 안에서 실행된다. SMT는 구성한 경우 적용된다.</desc>
