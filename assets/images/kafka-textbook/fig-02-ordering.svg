<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 318" width="300" height="318" role="img" aria-labelledby="fig-02-ordering-title fig-02-ordering-desc">
<title id="fig-02-ordering-title">파티션 안의 순서만 보장되고, 파티션 사이의 끼어들기는 정해져 있지 않다</title>
<desc id="fig-02-ordering-desc">P0의 A1, A2와 P1의 B1을 한 소비자가 받을 수 있는 순서 네 가지 중, A2가 A1보다 먼저 오는 순서만 일어나지 않는다는 것을 보여 준다.</desc>
