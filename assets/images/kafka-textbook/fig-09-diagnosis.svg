<title id="fig-09-diagnosis-title">소비 지연이 오를 때 가설을 가르는 순서</title>
<desc id="fig-09-diagnosis-desc">소비 지연 증가에서 출발해 poll 간격, 리밸런스 빈도, 파티션 쏠림을 차례로 확인하고, 각각 처리 지연, 그룹 불안정, 핫 파티션으로 가르며, 모두 아니면 유입 증가나 가져오기 지연을 의심하는 흐름도.</desc>
