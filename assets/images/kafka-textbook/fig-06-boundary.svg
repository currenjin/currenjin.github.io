<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 408" width="300" height="408" role="img" aria-labelledby="fig-06-boundary-title fig-06-boundary-desc">
<title id="fig-06-boundary-title">Kafka 트랜잭션의 원자성 경계와 외부 DB</title>
<desc id="fig-06-boundary-desc">변환기가 출력 토픽 쓰기와 입력 오프셋 기록을 한 트랜잭션으로 묶는 반면, 외부 결제 DB 쓰기는 경계 밖에 있어 abort되어도 남으며, read_committed 소비자와 read_uncommitted 소비자가 서로 다른 건수를 보는 모습.</desc>
