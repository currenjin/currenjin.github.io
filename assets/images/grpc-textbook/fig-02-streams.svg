<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="680" height="430" role="img" aria-labelledby="title desc">
<title id="title">네 가지 RPC 형태</title><desc id="desc">Unary는 양쪽 한 메시지, server stream은 응답 여러 개, client stream은 요청 여러 개, bidi는 양쪽 여러 개다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#555b6b"/></marker><marker id="accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#b5482a"/></marker></defs>
<rect width="680" height="430" fill="#fbfaf6"/>
<g font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><text x="340" y="30" font-size="18" fill="#26262b" text-anchor="middle">메시지 수와 방향으로 정하는 네 가지 RPC</text><text x="22" y="85" font-size="14" fill="#26262b" text-anchor="start">Unary</text><rect x="182" y="58" width="85" height="49" rx="6" fill="#fff" stroke="#555b6b"/><text x="224.5" y="85" font-size="15" fill="#26262b" text-anchor="middle">Client</text><rect x="545" y="58" width="85" height="49" rx="6" fill="#fff" stroke="#555b6b"/><text x="587.5" y="85" font-size="15" fill="#26262b" text-anchor="middle">Server</text><path d="M278,68 L532,68" fill="none" stroke="#555b6b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M532,93 L278,93" fill="none" stroke="#b5482a" stroke-width="1.5" marker-end="url(#accent)"/><rect x="360.0" y="63" width="12" height="10" rx="1" fill="#26262b"/><rect x="360.0" y="88" width="12" height="10" rx="1" fill="#b5482a"/><text x="22" y="162" font-size="14" fill="#26262b" text-anchor="start">Server stream</text><rect x="182" y="135" width="85" height="49" rx="6" fill="#fff" stroke="#555b6b"/><text x="224.5" y="162" font-size="15" fill="#26262b" text-anchor="middle">Client</text><rect x="545" y="135" width="85" height="49" rx="6" fill="#fff" stroke="#555b6b"/><text x="587.5" y="162" font-size="15" fill="#26262b" text-anchor="middle">Server</text><path d="M278,145 L532,145" fill="none" stroke="#555b6b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M532,170 L278,170" fill="none" stroke="#b5482a" stroke-width="1.5" marker-end="url(#accent)"/><rect x="360.0" y="140" width="12" height="10" rx="1" fill="#26262b"/><rect x="328.0" y="165" width="12" height="10" rx="1" fill="#b5482a"/><rect x="360.0" y="165" width="12" height="10" rx="1" fill="#b5482a"/><rect x="392.0" y="165" width="12" height="10" rx="1" fill="#b5482a"/><text x="22" y="239" font-size="14" fill="#26262b" text-anchor="start">Client stream</text><rect x="182" y="212" width="85" height="49" rx="6" fill="#fff" stroke="#555b6b"/><text x="224.5" y="239" font-size="15" fill="#26262b" text-anchor="middle">Client</text><rect x="545" y="212" width="85" height="49" rx="6" fill="#fff" stroke="#555b6b"/><text x="587.5" y="239" font-size="15" fill="#26262b" text-anchor="middle">Server</text><path d="M278,222 L532,222" fill="none" stroke="#555b6b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M532,247 L278,247" fill="none" stroke="#b5482a" stroke-width="1.5" marker-end="url(#accent)"/><rect x="328.0" y="217" width="12" height="10" rx="1" fill="#26262b"/><rect x="360.0" y="217" width="12" height="10" rx="1" fill="#26262b"/><rect x="392.0" y="217" width="12" height="10" rx="1" fill="#26262b"/><rect x="360.0" y="242" width="12" height="10" rx="1" fill="#b5482a"/><text x="22" y="316" font-size="14" fill="#26262b" text-anchor="start">Bidi stream</text><rect x="182" y="289" width="85" height="49" rx="6" fill="#fff" stroke="#555b6b"/><text x="224.5" y="316" font-size="15" fill="#26262b" text-anchor="middle">Client</text><rect x="545" y="289" width="85" height="49" rx="6" fill="#fff" stroke="#555b6b"/><text x="587.5" y="316" font-size="15" fill="#26262b" text-anchor="middle">Server</text><path d="M278,299 L532,299" fill="none" stroke="#555b6b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M532,324 L278,324" fill="none" stroke="#b5482a" stroke-width="1.5" marker-end="url(#accent)"/><rect x="328.0" y="294" width="12" height="10" rx="1" fill="#26262b"/><rect x="360.0" y="294" width="12" height="10" rx="1" fill="#26262b"/><rect x="392.0" y="294" width="12" height="10" rx="1" fill="#26262b"/><rect x="328.0" y="319" width="12" height="10" rx="1" fill="#b5482a"/><rect x="360.0" y="319" width="12" height="10" rx="1" fill="#b5482a"/><rect x="392.0" y="319" width="12" height="10" rx="1" fill="#b5482a"/><text x="340" y="384" font-size="15" fill="#555b6b" text-anchor="middle">순서는 한 RPC의 각 방향 안에서 유지된다</text><text x="340" y="409" font-size="13" fill="#555b6b" text-anchor="middle">Bidi의 두 방향은 독립적이며 1:1 대응을 요구하지 않는다</text></g>
</svg>