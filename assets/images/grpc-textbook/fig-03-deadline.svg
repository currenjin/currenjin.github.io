<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" role="img" aria-labelledby="title desc">
<title id="title">연쇄 호출의 시간 예산</title><desc id="desc">원래 deadline을 전파할 때 전체 예산 1초 중 주문 서버가 200ms를 쓰면 하위 호출과 응답 정리에 쓸 수 있는 예산은 최대 800ms다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#555b6b"/></marker><marker id="accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#b5482a"/></marker></defs>
<rect width="680" height="380" fill="#fbfaf6"/>
<g font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><text x="340" y="30" font-size="18" fill="#26262b" text-anchor="middle">최초 요청의 예산 1초를 함께 쓴다</text><rect x="25" y="65" width="150" height="62" rx="6" fill="#fff" stroke="#555b6b"/><text x="100.0" y="92" font-size="15" fill="#26262b" text-anchor="middle">Client</text><text x="100.0" y="114" font-size="12" fill="#555b6b" text-anchor="middle">전체 timeout 1s</text><rect x="260" y="65" width="150" height="62" rx="6" fill="#fff" stroke="#555b6b"/><text x="335.0" y="92" font-size="15" fill="#26262b" text-anchor="middle">주문 서버</text><text x="335.0" y="114" font-size="12" fill="#555b6b" text-anchor="middle">검증에 200ms 사용</text><rect x="505" y="65" width="150" height="62" rx="6" fill="#fff" stroke="#555b6b"/><text x="580.0" y="92" font-size="15" fill="#26262b" text-anchor="middle">재고 서버</text><text x="580.0" y="114" font-size="12" fill="#555b6b" text-anchor="middle">하위 RPC</text><path d="M184,96 L250,96" fill="none" stroke="#555b6b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M419,96 L495,96" fill="none" stroke="#555b6b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="190" width="600" height="48" rx="5" fill="#e8e6e0"/><rect x="40" y="190" width="120" height="48" rx="5" fill="#555b6b"/><text x="100" y="220" font-size="15" fill="#fff" text-anchor="middle">200ms</text><text x="400" y="220" font-size="17" fill="#26262b" text-anchor="middle">남은 최대 800ms</text><text x="340" y="277" font-size="16" fill="#26262b" text-anchor="middle">하위 처리 + 응답 정리는 남은 예산 안에서</text><text x="340" y="319" font-size="16" fill="#b5482a" text-anchor="middle">하위 서버마다 새 1초를 주지 않는다</text><text x="340" y="351" font-size="13" fill="#555b6b" text-anchor="middle">전제: 원래 deadline을 하위 호출로 전파한다</text></g>
</svg>