<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" role="img" aria-labelledby="title desc">
<title id="title">원격 호출의 세 경계</title><desc id="desc">요청 전송과 DB 변경, 응답 전송 사이에 각각 실패할 수 있다. 응답이 유실되어도 DB 변경은 끝났을 수 있다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#555b6b"/></marker><marker id="accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#b5482a"/></marker></defs>
<rect width="680" height="360" fill="#fbfaf6"/>
<g font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><text x="340" y="30" font-size="18" fill="#26262b" text-anchor="middle">요청 도착·업무 실행·응답 도착은 다른 경계</text><rect x="30" y="60" width="175" height="62" rx="6" fill="#fff" stroke="#555b6b"/><text x="117.5" y="87" font-size="15" fill="#26262b" text-anchor="middle">주문 서비스</text><text x="117.5" y="109" font-size="12" fill="#555b6b" text-anchor="middle">client stub</text><rect x="470" y="60" width="175" height="62" rx="6" fill="#fff" stroke="#555b6b"/><text x="557.5" y="87" font-size="15" fill="#26262b" text-anchor="middle">재고 서비스</text><text x="557.5" y="109" font-size="12" fill="#555b6b" text-anchor="middle">server handler</text><path d="M215,85 L458,85" fill="none" stroke="#555b6b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="336.5" y="76.0" font-size="13" fill="#555b6b" text-anchor="middle">요청</text><path d="M458,155 L215,155" fill="none" stroke="#b5482a" stroke-width="1.5" marker-end="url(#accent)"/><text x="336.5" y="146.0" font-size="13" fill="#b5482a" text-anchor="middle">응답이 도착하지 않을 수 있다</text><rect x="470" y="215" width="175" height="62" rx="6" fill="#fff" stroke="#555b6b"/><text x="557.5" y="242" font-size="15" fill="#26262b" text-anchor="middle">재고 DB</text><text x="557.5" y="264" font-size="12" fill="#555b6b" text-anchor="middle">변경 commit</text><path d="M558,132 L558,205" fill="none" stroke="#555b6b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="220" y="226" font-size="16" fill="#b5482a" text-anchor="middle">응답을 못 받아도</text><text x="220" y="254" font-size="16" fill="#b5482a" text-anchor="middle">DB 변경은 끝났을 수 있다</text><text x="340" y="325" font-size="16" fill="#26262b" text-anchor="middle">통신 결과 ≠ 업무 실행 여부</text></g>
</svg>