<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 375" width="680" height="375" role="img" aria-labelledby="title desc">
<title id="title">이름 해석과 새 RPC 부하 분산</title><desc id="desc">Resolver가 주소와 config를 제공하고 picker가 새 RPC의 backend 연결을 선택한다. 기존 stream은 자동 이동하지 않는다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#555b6b"/></marker><marker id="accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#b5482a"/></marker></defs>
<rect width="680" height="375" fill="#fbfaf6"/>
<g font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><text x="340" y="30" font-size="18" fill="#26262b" text-anchor="middle">주소를 알아야 새 RPC를 분산할 수 있다</text><rect x="20" y="65" width="160" height="62" rx="6" fill="#fff" stroke="#555b6b"/><text x="100.0" y="92" font-size="15" fill="#26262b" text-anchor="middle">Name resolver</text><text x="100.0" y="114" font-size="12" fill="#555b6b" text-anchor="middle">주소 + service config</text><rect x="265" y="65" width="150" height="62" rx="6" fill="#fff" stroke="#555b6b"/><text x="340.0" y="92" font-size="15" fill="#26262b" text-anchor="middle">LB / picker</text><text x="340.0" y="114" font-size="12" fill="#555b6b" text-anchor="middle">새 RPC의 선택</text><path d="M190,96 L255,96" fill="none" stroke="#555b6b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="510" y="65" width="150" height="62" rx="6" fill="#fff" stroke="#555b6b"/><text x="585.0" y="92" font-size="15" fill="#26262b" text-anchor="middle">Backend A</text><text x="585.0" y="114" font-size="12" fill="#555b6b" text-anchor="middle">연결 대상</text><path d="M425,96 L500,96" fill="none" stroke="#555b6b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="510" y="158" width="150" height="62" rx="6" fill="#fff" stroke="#555b6b"/><text x="585.0" y="185" font-size="15" fill="#26262b" text-anchor="middle">Backend B</text><text x="585.0" y="207" font-size="12" fill="#555b6b" text-anchor="middle">연결 대상</text><path d="M425,96 L500,189" fill="none" stroke="#555b6b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="510" y="251" width="150" height="62" rx="6" fill="#fff" stroke="#555b6b"/><text x="585.0" y="278" font-size="15" fill="#26262b" text-anchor="middle">Backend C</text><text x="585.0" y="300" font-size="12" fill="#555b6b" text-anchor="middle">연결 대상</text><path d="M425,96 L500,282" fill="none" stroke="#555b6b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="170" y="205" font-size="15" fill="#26262b" text-anchor="middle">pick_first: 선택한 READY 연결</text><text x="170" y="241" font-size="15" fill="#26262b" text-anchor="middle">round_robin: READY 연결 순환</text><text x="340" y="345" font-size="16" fill="#b5482a" text-anchor="middle">이미 시작한 stream은 다른 서버로 자동 이동하지 않는다</text></g>
</svg>